name: Nightly encrypted backup
# Free backup (no billing needed): exports every Firestore collection to JSON, encrypts it with a key derived
# from the FIREBASE_SERVICE_ACCOUNT secret, and keeps it as a workflow artifact for 90 days.
# Restore: download the artifact, then  openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in backup.json.enc -out backup.json
on:
  schedule: [{ cron: '17 23 * * *' }]   # runs once this file is on the default branch (main)
  workflow_dispatch:
  push:
    branches: [claude/ratio-quality-requirements-pb9ouc]   # until merged: back up after every release
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export and encrypt
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          BASE="https://firestore.googleapis.com/v1/projects/ratio-quality/databases/(default)/documents"
          mkdir -p out
          for C in users branches inspections actions photos equipment baristas baristaEvals audit config counters; do
            PAGE=""; echo "[]" > "out/$C.json"
            while :; do
              R=$(curl -sf "$BASE/$C?pageSize=300${PAGE:+&pageToken=$PAGE}" -H "Authorization: Bearer $TOKEN" || echo '{}')
              jq -s '.[0] + (.[1].documents // [])' "out/$C.json" <(echo "$R") > "out/$C.tmp" && mv "out/$C.tmp" "out/$C.json"
              PAGE=$(echo "$R" | jq -r '.nextPageToken // empty'); [ -z "$PAGE" ] && break
            done
            echo "$C: $(jq length out/$C.json) docs"
          done
          tar -czf backup.tgz -C out .
          KEY=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | sha256sum | cut -d' ' -f1)
          KEY="$KEY" openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -in backup.tgz -out "ratio-quality-$(date -u +%F).tgz.enc"
          rm -rf out backup.tgz "$RUNNER_TEMP/sa.json"
      - uses: actions/upload-artifact@v4
        with:
          name: firestore-backup
          path: ratio-quality-*.tgz.enc
          retention-days: 90
