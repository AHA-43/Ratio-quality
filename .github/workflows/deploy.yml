name: Deploy to Firebase
on:
  push:
    branches: [main, claude/ratio-quality-requirements-pb9ouc]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/ratio-quality test
      - name: Security rules tests (Firestore emulator)
        run: pnpm --filter @workspace/ratio-quality test:rules
      - name: Multi-user end-to-end test (Auth + Firestore emulators, two devices)
        run: |
          npm i -g playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          NODE_PATH=$(npm root -g) pnpm --filter @workspace/ratio-quality test:cloud
      - run: pnpm --filter @workspace/ratio-quality build
      - name: Deploy hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools deploy --only hosting --project ratio-quality
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Publish Firestore security rules (REST API)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          P=projects/ratio-quality
          BODY=$(jq -n --rawfile c firestore.rules '{source:{files:[{name:"firestore.rules",content:$c}]}}')
          RULESET=$(curl -sf -X POST "https://firebaserules.googleapis.com/v1/$P/rulesets" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY" | jq -r .name)
          echo "ruleset: $RULESET"
          REL=$(jq -n --arg n "$P/releases/cloud.firestore" --arg r "$RULESET" '{release:{name:$n,rulesetName:$r}}')
          curl -sf -X PATCH "https://firebaserules.googleapis.com/v1/$P/releases/cloud.firestore" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$REL" >/dev/null \
          || curl -sf -X POST "https://firebaserules.googleapis.com/v1/$P/releases" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"name\":\"$P/releases/cloud.firestore\",\"rulesetName\":\"$RULESET\"}" >/dev/null
          echo "Firestore rules published"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Publish Storage security rules (needs Storage enabled)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          P=projects/ratio-quality
          BUCKET=ratio-quality.firebasestorage.app
          BODY=$(jq -n --rawfile c storage.rules '{source:{files:[{name:"storage.rules",content:$c}]}}')
          RULESET=$(curl -sf -X POST "https://firebaserules.googleapis.com/v1/$P/rulesets" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY" | jq -r .name)
          REL=$(jq -n --arg n "$P/releases/firebase.storage/$BUCKET" --arg r "$RULESET" '{release:{name:$n,rulesetName:$r}}')
          curl -sf -X PATCH "https://firebaserules.googleapis.com/v1/$P/releases/firebase.storage/$BUCKET" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$REL" >/dev/null \
          || curl -sf -X POST "https://firebaserules.googleapis.com/v1/$P/releases" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"name\":\"$P/releases/firebase.storage/$BUCKET\",\"rulesetName\":\"$RULESET\"}" >/dev/null
          echo "Storage rules published"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Invite users from config/invites.txt (creates account once, sends set-password email)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
        run: |
          set -uo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          KEY=$(grep -m1 '^VITE_FIREBASE_API_KEY=' artifacts/ratio-quality/.env.production | cut -d= -f2)
          { grep -vE '^\s*(#|$)' config/invites.txt || true; } | while read -r EMAIL; do
            PW=$(openssl rand -base64 24)
            BODY=$(jq -n --arg e "$EMAIL" --arg p "$PW" '{email:$e,password:$p,emailVerified:true}')
            RES=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/projects/ratio-quality/accounts" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY")
            if echo "$RES" | jq -e '.localId' >/dev/null 2>&1; then
              curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=$KEY" \
                -H "Content-Type: application/json" -H "X-Firebase-Locale: ar" \
                -d "$(jq -n --arg e "$EMAIL" '{requestType:"PASSWORD_RESET",email:$e}')" | jq -r '"invite sent to " + .email'
            else
              echo "skip $EMAIL: $(echo "$RES" | jq -r '.error.message // "unknown"')"
            fi
          done
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Harden sign-in (password policy, email-enumeration protection)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -uo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          BODY='{"passwordPolicyConfig":{"passwordPolicyEnforcementState":"ENFORCE","forceUpgradeOnSignin":false,"passwordPolicyVersions":[{"customStrengthOptions":{"minPasswordLength":10}}]},"emailPrivacyConfig":{"enableImprovedEmailPrivacy":true}}'
          curl -s -X PATCH "https://identitytoolkit.googleapis.com/admin/v2/projects/ratio-quality/config?updateMask=passwordPolicyConfig,emailPrivacyConfig" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "X-Goog-User-Project: ratio-quality" -d "$BODY" \
            | jq -c '{passwordPolicy: .passwordPolicyConfig.passwordPolicyEnforcementState, minLength: .passwordPolicyConfig.passwordPolicyVersions[0].customStrengthOptions.minPasswordLength, emailPrivacy: .emailPrivacyConfig.enableImprovedEmailPrivacy, error: .error.message}'
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Apply roles from config/roles.json (and report how many visits each of those users has in the cloud)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -uo pipefail
          [ -f config/roles.json ] || exit 0
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          IT="https://identitytoolkit.googleapis.com/v1"; FS="https://firestore.googleapis.com/v1/projects/ratio-quality/databases/(default)/documents"
          jq -c '.[]' config/roles.json | while read -r U; do
            EMAIL=$(jq -r .email <<<"$U"); ROLE=$(jq -r .role <<<"$U"); CA=$(jq -r '.canApprove // false' <<<"$U")
            LID=$(curl -s -X POST "$IT/projects/ratio-quality/accounts:lookup" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$(jq -n --arg e "$EMAIL" '{email:[$e]}')" | jq -r '.users[0].localId // empty')
            [ -n "$LID" ] || { echo "no account for user #$(echo -n "$EMAIL" | sha1sum | cut -c1-6)"; continue; }
            BODY=$(jq -n --arg r "$ROLE" --argjson c "$CA" '{fields:{role:{stringValue:$r},canApprove:{booleanValue:$c},active:{booleanValue:true}}}')
            curl -s -X PATCH "$FS/users/$LID?updateMask.fieldPaths=role&updateMask.fieldPaths=canApprove&updateMask.fieldPaths=active" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY" | jq -r '"role set: " + .fields.role.stringValue + " canApprove=" + (.fields.canApprove.booleanValue|tostring)'
            Q=$(jq -n --arg u "$LID" '{structuredQuery:{from:[{collectionId:"inspections"}],where:{fieldFilter:{field:{fieldPath:"inspectorUid"},op:"EQUAL",value:{stringValue:$u}}},select:{fields:[{fieldPath:"status"},{fieldPath:"workflow"}]}}}')
            curl -s -X POST "$FS:runQuery" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$Q" \
              | jq -r '[.[] | select(.document) | ((.document.fields.status.stringValue // "?") + "/" + (.document.fields.workflow.stringValue // "-"))] | group_by(.) | map("\(.[0]): \(length)") | "visits in cloud for this user: " + (if length == 0 then "none" else join(", ") end)'
          done
          TOTAL=$(curl -s -X POST "$FS:runQuery" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"structuredQuery":{"from":[{"collectionId":"inspections"}],"select":{"fields":[{"fieldPath":"status"}]}}}' | jq '[.[] | select(.document)] | length')
          echo "visits in cloud (all users): $TOTAL"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Provision accounts with a preset password (config/provision.json holds only salted PBKDF2 hashes)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -uo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          KEY=$(grep -m1 '^VITE_FIREBASE_API_KEY=' artifacts/ratio-quality/.env.production | cut -d= -f2)
          IT="https://identitytoolkit.googleapis.com/v1"
          hash() { python3 - "$1" "$2" <<'PY'
          import sys,hashlib,base64
          pw,salt=sys.argv[1].encode(),base64.b64decode(sys.argv[2])
          print(base64.b64encode(hashlib.pbkdf2_hmac('sha256',pw,salt,120000,dklen=32)).decode())
          PY
          }
          # --- self-test: import a throw-away user from a hash, then sign in with the plain password, then delete it
          TP=$(openssl rand -hex 12); TS=$(openssl rand -base64 16); TL="cihash$(openssl rand -hex 8)"; TE="ci-hash-${GITHUB_RUN_ID}@example.com"
          TH=$(hash "$TP" "$TS")
          curl -s -X POST "$IT/projects/ratio-quality/accounts:batchCreate" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg l "$TL" --arg e "$TE" --arg h "$TH" --arg s "$TS" '{hashAlgorithm:"PBKDF2_SHA256",rounds:120000,users:[{localId:$l,email:$e,emailVerified:true,passwordHash:$h,salt:$s}]}')" | jq -c '.' 
          OK=$(curl -s -X POST "$IT/accounts:signInWithPassword?key=$KEY" -H "Content-Type: application/json" -d "$(jq -n --arg e "$TE" --arg p "$TP" '{email:$e,password:$p,returnSecureToken:true}')" | jq -r '.idToken // empty')
          curl -s -X POST "$IT/projects/ratio-quality/accounts:delete" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"localId\":\"$TL\"}" >/dev/null
          if [ -z "$OK" ]; then echo "SELFTEST FAILED: hash import did not allow sign-in; provisioning skipped"; rm -f "$RUNNER_TEMP/sa.json"; exit 1; fi
          echo "SELFTEST OK: hash-imported account can sign in"
          [ -f config/provision.json ] || { echo "no provision.json"; rm -f "$RUNNER_TEMP/sa.json"; exit 0; }
          jq -c '.[]' config/provision.json | while read -r U; do
            EMAIL=$(jq -r .email <<<"$U")
            LOOK=$(curl -s -X POST "$IT/projects/ratio-quality/accounts:lookup" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$(jq -n --arg e "$EMAIL" '{email:[$e]}')")
            LID=$(jq -r '.users[0].localId // empty' <<<"$LOOK"); LAST=$(jq -r '.users[0].lastLoginAt // empty' <<<"$LOOK")
            if [ -n "$LID" ] && [ -n "$LAST" ]; then echo "keep $EMAIL (has already signed in, password untouched)"; continue; fi
            [ -n "$LID" ] || LID="u$(openssl rand -hex 14)"
            R=$(curl -s -X POST "$IT/projects/ratio-quality/accounts:batchCreate" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg l "$LID" --arg e "$EMAIL" --argjson u "$U" '{allowOverwrite:true,hashAlgorithm:"PBKDF2_SHA256",rounds:120000,users:[{localId:$l,email:$e,emailVerified:true,passwordHash:$u.hash,salt:$u.salt}]}')")
            echo "provision $EMAIL: $(echo "$R" | jq -c '.error // "ok"')"
            # verify without knowing the password is impossible here: the self-test above proves the method
          done
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Ensure project owner (earliest account) is admin
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          OWNER=$(curl -sf -X POST "https://identitytoolkit.googleapis.com/v1/projects/ratio-quality/accounts:query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"returnUserInfo":true,"limit":"500"}' \
            | jq -r '.userInfo | sort_by(.createdAt | tonumber) | .[0].localId')
          DOC="https://firestore.googleapis.com/v1/projects/ratio-quality/databases/(default)/documents/users/$OWNER"
          curl -sf -X PATCH "$DOC?updateMask.fieldPaths=role&updateMask.fieldPaths=canApprove&updateMask.fieldPaths=active" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"fields":{"role":{"stringValue":"admin"},"canApprove":{"booleanValue":true},"active":{"booleanValue":true}}}' >/dev/null
          echo "owner account set as admin"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Live smoke test on the deployed site (temporary account, cleaned up)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -uo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          # purge leftovers of earlier smoke runs (cancelled runs never reach their own cleanup)
          FS0="https://firestore.googleapis.com/v1/projects/ratio-quality/databases/(default)/documents"
          q() { curl -s -X POST "$FS0:runQuery" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"structuredQuery\":{\"from\":[{\"collectionId\":\"$1\"}],\"where\":{\"compositeFilter\":{\"op\":\"AND\",\"filters\":[{\"fieldFilter\":{\"field\":{\"fieldPath\":\"$2\"},\"op\":\"GREATER_THAN_OR_EQUAL\",\"value\":{\"stringValue\":\"ci-smoke-\"}}},{\"fieldFilter\":{\"field\":{\"fieldPath\":\"$2\"},\"op\":\"LESS_THAN\",\"value\":{\"stringValue\":\"ci-smoke.\"}}}]}}}}" ; }
          q inspections inspector | jq -r '.[].document.name // empty' | while read -r N; do curl -s -X DELETE "https://firestore.googleapis.com/v1/$N" -H "Authorization: Bearer $TOKEN" >/dev/null; done
          q users email | jq -r '.[].document.name // empty' | while read -r N; do OLD=${N##*/}; curl -s -X DELETE "https://firestore.googleapis.com/v1/$N" -H "Authorization: Bearer $TOKEN" >/dev/null; curl -s -X POST "https://identitytoolkit.googleapis.com/v1/projects/ratio-quality/accounts:delete" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"localId\":\"$OLD\"}" >/dev/null; done
          EMAIL="ci-smoke-${GITHUB_RUN_ID}@example.com"; PW=$(openssl rand -base64 18)
          UID_=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/projects/ratio-quality/accounts" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg e "$EMAIL" --arg p "$PW" '{email:$e,password:$p,emailVerified:true}')" | jq -r .localId)
          npm i -g playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          export NODE_PATH=$(npm root -g)
          cd artifacts/ratio-quality
          sleep 20
          APP_URL=https://ratio-quality.web.app EMAIL="$EMAIL" PASSWORD="$PW" TOKEN="$TOKEN" node tests/live-smoke.mjs | tee "$RUNNER_TEMP/smoke.txt"; RC=${PIPESTATUS[0]}
          # cleanup: everything created by the temporary account
          FS="https://firestore.googleapis.com/v1/projects/ratio-quality/databases/(default)/documents"
          IID=$(grep -o 'INSPECTION_ID=.*' "$RUNNER_TEMP/smoke.txt" | cut -d= -f2)
          for C in photos audit; do
            curl -s -X POST "https://firestore.googleapis.com/v1/projects/ratio-quality/databases/(default)/documents:runQuery" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"structuredQuery\":{\"from\":[{\"collectionId\":\"$C\"}],\"where\":{\"fieldFilter\":{\"field\":{\"fieldPath\":\"uid\"},\"op\":\"EQUAL\",\"value\":{\"stringValue\":\"$UID_\"}}}}}" \
              | jq -r '.[].document.name // empty' | while read -r N; do curl -s -X DELETE "https://firestore.googleapis.com/v1/$N" -H "Authorization: Bearer $TOKEN" >/dev/null; done
          done
          [ -n "$IID" ] && curl -s -X DELETE "$FS/inspections/$IID" -H "Authorization: Bearer $TOKEN" >/dev/null
          q inspections inspector | jq -r '.[].document.name // empty' | while read -r N; do curl -s -X DELETE "https://firestore.googleapis.com/v1/$N" -H "Authorization: Bearer $TOKEN" >/dev/null; done
          curl -s -X DELETE "$FS/users/$UID_" -H "Authorization: Bearer $TOKEN" >/dev/null
          curl -s -X POST "https://identitytoolkit.googleapis.com/v1/projects/ratio-quality/accounts:delete" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"localId\":\"$UID_\"}" >/dev/null
          echo "temporary account and its data removed"
          rm -f "$RUNNER_TEMP/sa.json"
          exit $RC
