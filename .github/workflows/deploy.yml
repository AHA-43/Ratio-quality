name: Deploy to Firebase
on:
  push:
    branches: [main, claude/ratio-quality-requirements-pb9ouc]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/ratio-quality test
      - name: Security rules tests (Firestore emulator)
        run: pnpm --filter @workspace/ratio-quality test:rules
      - name: Multi-user end-to-end test (Auth + Firestore emulators, two devices)
        run: |
          npm i -g playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          NODE_PATH=$(npm root -g) pnpm --filter @workspace/ratio-quality test:cloud
      - run: pnpm --filter @workspace/ratio-quality build
      - name: Deploy hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools deploy --only hosting --project ratio-quality
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Publish Firestore security rules (REST API)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          P=projects/ratio-quality
          BODY=$(jq -n --rawfile c firestore.rules '{source:{files:[{name:"firestore.rules",content:$c}]}}')
          RULESET=$(curl -sf -X POST "https://firebaserules.googleapis.com/v1/$P/rulesets" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY" | jq -r .name)
          echo "ruleset: $RULESET"
          REL=$(jq -n --arg n "$P/releases/cloud.firestore" --arg r "$RULESET" '{release:{name:$n,rulesetName:$r}}')
          curl -sf -X PATCH "https://firebaserules.googleapis.com/v1/$P/releases/cloud.firestore" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$REL" >/dev/null \
          || curl -sf -X POST "https://firebaserules.googleapis.com/v1/$P/releases" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"name\":\"$P/releases/cloud.firestore\",\"rulesetName\":\"$RULESET\"}" >/dev/null
          echo "Firestore rules published"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Publish Storage security rules (needs Storage enabled)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          P=projects/ratio-quality
          BUCKET=ratio-quality.firebasestorage.app
          BODY=$(jq -n --rawfile c storage.rules '{source:{files:[{name:"storage.rules",content:$c}]}}')
          RULESET=$(curl -sf -X POST "https://firebaserules.googleapis.com/v1/$P/rulesets" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY" | jq -r .name)
          REL=$(jq -n --arg n "$P/releases/firebase.storage/$BUCKET" --arg r "$RULESET" '{release:{name:$n,rulesetName:$r}}')
          curl -sf -X PATCH "https://firebaserules.googleapis.com/v1/$P/releases/firebase.storage/$BUCKET" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$REL" >/dev/null \
          || curl -sf -X POST "https://firebaserules.googleapis.com/v1/$P/releases" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"name\":\"$P/releases/firebase.storage/$BUCKET\",\"rulesetName\":\"$RULESET\"}" >/dev/null
          echo "Storage rules published"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Invite users from config/invites.txt (creates account once, sends set-password email)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
        run: |
          set -uo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          KEY=$(grep -m1 '^VITE_FIREBASE_API_KEY=' artifacts/ratio-quality/.env.production | cut -d= -f2)
          grep -vE '^\s*(#|$)' config/invites.txt | while read -r EMAIL; do
            PW=$(openssl rand -base64 24)
            BODY=$(jq -n --arg e "$EMAIL" --arg p "$PW" '{email:$e,password:$p,emailVerified:true}')
            RES=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/projects/ratio-quality/accounts" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY")
            if echo "$RES" | jq -e '.localId' >/dev/null 2>&1; then
              curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=$KEY" \
                -H "Content-Type: application/json" -H "X-Firebase-Locale: ar" \
                -d "$(jq -n --arg e "$EMAIL" '{requestType:"PASSWORD_RESET",email:$e}')" | jq -r '"invite sent to " + .email'
            else
              echo "skip $EMAIL: $(echo "$RES" | jq -r '.error.message // "unknown"')"
            fi
          done
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Ensure project owner (earliest account) is admin
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          OWNER=$(curl -sf -X POST "https://identitytoolkit.googleapis.com/v1/projects/ratio-quality/accounts:query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"returnUserInfo":true,"limit":"500"}' \
            | jq -r '.userInfo | sort_by(.createdAt | tonumber) | .[0].localId')
          DOC="https://firestore.googleapis.com/v1/projects/ratio-quality/databases/(default)/documents/users/$OWNER"
          curl -sf -X PATCH "$DOC?updateMask.fieldPaths=role&updateMask.fieldPaths=canApprove&updateMask.fieldPaths=active" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"fields":{"role":{"stringValue":"admin"},"canApprove":{"booleanValue":true},"active":{"booleanValue":true}}}' >/dev/null
          echo "owner account set as admin"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Live smoke test on the deployed site (temporary account, cleaned up)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -uo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          EMAIL="ci-smoke-${GITHUB_RUN_ID}@example.com"; PW=$(openssl rand -base64 18)
          UID_=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/projects/ratio-quality/accounts" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg e "$EMAIL" --arg p "$PW" '{email:$e,password:$p,emailVerified:true}')" | jq -r .localId)
          npm i -g playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          export NODE_PATH=$(npm root -g)
          cd artifacts/ratio-quality
          sleep 20
          APP_URL=https://ratio-quality.web.app EMAIL="$EMAIL" PASSWORD="$PW" TOKEN="$TOKEN" node tests/live-smoke.mjs | tee "$RUNNER_TEMP/smoke.txt"; RC=${PIPESTATUS[0]}
          # cleanup: everything created by the temporary account
          FS="https://firestore.googleapis.com/v1/projects/ratio-quality/databases/(default)/documents"
          IID=$(grep -o 'INSPECTION_ID=.*' "$RUNNER_TEMP/smoke.txt" | cut -d= -f2)
          for C in photos audit; do
            curl -s -X POST "https://firestore.googleapis.com/v1/projects/ratio-quality/databases/(default)/documents:runQuery" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"structuredQuery\":{\"from\":[{\"collectionId\":\"$C\"}],\"where\":{\"fieldFilter\":{\"field\":{\"fieldPath\":\"uid\"},\"op\":\"EQUAL\",\"value\":{\"stringValue\":\"$UID_\"}}}}}" \
              | jq -r '.[].document.name // empty' | while read -r N; do curl -s -X DELETE "https://firestore.googleapis.com/v1/$N" -H "Authorization: Bearer $TOKEN" >/dev/null; done
          done
          [ -n "$IID" ] && curl -s -X DELETE "$FS/inspections/$IID" -H "Authorization: Bearer $TOKEN" >/dev/null
          curl -s -X DELETE "$FS/users/$UID_" -H "Authorization: Bearer $TOKEN" >/dev/null
          curl -s -X POST "https://identitytoolkit.googleapis.com/v1/projects/ratio-quality/accounts:delete" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"localId\":\"$UID_\"}" >/dev/null
          echo "temporary account and its data removed"
          rm -f "$RUNNER_TEMP/sa.json"
          exit $RC
